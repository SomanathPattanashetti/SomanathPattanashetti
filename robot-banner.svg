<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200">
  <defs>
    <style>
      .bg { fill: #020c12; }
      .grid-line { stroke: rgba(0,245,255,0.06); stroke-width: 0.8; }
      .cyan { fill: none; stroke: #00f5ff; stroke-width: 1.2; }
      .cyan-fill { fill: #00f5ff; }
      .dim { stroke: rgba(0,245,255,0.3); stroke-width: 1; fill: none; }
      .text-main { font-family: 'Courier New', monospace; fill: #00f5ff; }
      .text-sub  { font-family: 'Courier New', monospace; fill: rgba(0,245,255,0.6); }
      .text-name { font-family: 'Courier New', monospace; fill: #e8f8ff; font-weight: bold; }

      /* Robot 1 — left */
      .r1 { animation: floatUp1 9s linear infinite; }
      @keyframes floatUp1 {
        0%   { transform: translate(68px, 195px) rotate(0deg);   opacity: 0; }
        5%   { opacity: 0.45; }
        90%  { opacity: 0.35; }
        100% { transform: translate(54px, -20px) rotate(8deg);   opacity: 0; }
      }

      /* Robot 2 — mid-left */
      .r2 { animation: floatUp2 11s linear infinite; animation-delay: -3s; }
      @keyframes floatUp2 {
        0%   { transform: translate(210px, 205px) rotate(0deg);  opacity: 0; }
        5%   { opacity: 0.4; }
        90%  { opacity: 0.3; }
        100% { transform: translate(196px, -20px) rotate(-6deg); opacity: 0; }
      }

      /* Robot 3 — right */
      .r3 { animation: floatUp3 10s linear infinite; animation-delay: -6s; }
      @keyframes floatUp3 {
        0%   { transform: translate(780px, 200px) rotate(0deg);  opacity: 0; }
        5%   { opacity: 0.4; }
        90%  { opacity: 0.3; }
        100% { transform: translate(765px, -20px) rotate(5deg);  opacity: 0; }
      }

      /* Gear 1 */
      .g1 { animation: gearFloat1 13s linear infinite; animation-delay: -2s; }
      @keyframes gearFloat1 {
        0%   { transform: translate(340px, 200px) rotate(0deg);   opacity: 0; }
        5%   { opacity: 0.35; }
        90%  { opacity: 0.25; }
        100% { transform: translate(326px, -20px) rotate(180deg); opacity: 0; }
      }

      /* Gear 2 */
      .g2 { animation: gearFloat2 15s linear infinite; animation-delay: -8s; }
      @keyframes gearFloat2 {
        0%   { transform: translate(650px, 205px) rotate(0deg);   opacity: 0; }
        5%   { opacity: 0.3; }
        90%  { opacity: 0.22; }
        100% { transform: translate(638px, -20px) rotate(-200deg); opacity: 0; }
      }

      /* Circuit node 1 */
      .c1 { animation: circFloat1 8s linear infinite; animation-delay: -4s; }
      @keyframes circFloat1 {
        0%   { transform: translate(480px, 200px); opacity: 0; }
        5%   { opacity: 0.38; }
        90%  { opacity: 0.28; }
        100% { transform: translate(480px, -20px); opacity: 0; }
      }

      /* Circuit node 2 */
      .c2 { animation: circFloat2 12s linear infinite; animation-delay: -1s; }
      @keyframes circFloat2 {
        0%   { transform: translate(130px, 205px); opacity: 0; }
        5%   { opacity: 0.32; }
        90%  { opacity: 0.22; }
        100% { transform: translate(130px, -20px); opacity: 0; }
      }

      /* Signal lines */
      .sl1 { animation: sigLine1 7s linear infinite; animation-delay: 0s; }
      @keyframes sigLine1 {
        0%   { transform: translateY(200px); opacity: 0; }
        10%  { opacity: 0.18; }
        90%  { opacity: 0.1; }
        100% { transform: translateY(-5px); opacity: 0; }
      }
      .sl2 { animation: sigLine2 9s linear infinite; animation-delay: -3.5s; }
      @keyframes sigLine2 {
        0%   { transform: translateY(200px); opacity: 0; }
        10%  { opacity: 0.14; }
        90%  { opacity: 0.08; }
        100% { transform: translateY(-5px); opacity: 0; }
      }
      .sl3 { animation: sigLine3 11s linear infinite; animation-delay: -6s; }
      @keyframes sigLine3 {
        0%   { transform: translateY(200px); opacity: 0; }
        10%  { opacity: 0.16; }
        90%  { opacity: 0.09; }
        100% { transform: translateY(-5px); opacity: 0; }
      }

      /* Scanline */
      .scan { animation: scanAnim 5s linear infinite; }
      @keyframes scanAnim {
        0%   { transform: translateY(-4px); opacity: 0.7; }
        100% { transform: translateY(204px); opacity: 0.1; }
      }

      /* Pulse dots */
      .pd1 { animation: pulseDot 2.2s ease-in-out infinite; }
      .pd2 { animation: pulseDot 2.2s ease-in-out infinite; animation-delay: -1.1s; }
      @keyframes pulseDot {
        0%,100% { opacity: 0.9; r: 3; }
        50%     { opacity: 0.3; r: 5; }
      }

      /* Eye blink on robots */
      .eye { animation: eyeBlink 4s ease-in-out infinite; }
      .eye2 { animation: eyeBlink 4s ease-in-out infinite; animation-delay: -2s; }
      @keyframes eyeBlink {
        0%,90%,100% { opacity: 1; }
        95%         { opacity: 0; }
      }

      /* Core pulse */
      .core { animation: corePulse 1.8s ease-in-out infinite; }
      .core2 { animation: corePulse 1.8s ease-in-out infinite; animation-delay: -0.9s; }
      @keyframes corePulse {
        0%,100% { opacity: 0.9; }
        50%     { opacity: 0.3; }
      }

      /* Text fade-in */
      .title-anim { animation: titleIn 1.2s ease both; }
      @keyframes titleIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,245,255,0.05)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" class="bg" rx="6"/>
  <rect width="860" height="200" fill="url(#grid)" rx="6"/>

  <!-- Border -->
  <rect x="1" y="1" width="858" height="198" fill="none" stroke="rgba(0,245,255,0.18)" stroke-width="1" rx="6"/>

  <!-- Corner accents -->
  <polyline points="1,30 1,6 26,6"   fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.7"/>
  <polyline points="834,6 859,6 859,30" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.7"/>
  <polyline points="1,170 1,194 26,194" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.7"/>
  <polyline points="834,194 859,194 859,170" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.7"/>

  <!-- Scanline -->
  <rect class="scan" x="1" y="0" width="858" height="2" fill="rgba(0,245,255,0.25)" rx="1"/>

  <!-- ─── SIGNAL LINES ─── -->
  <g class="sl1">
    <line x1="20" y1="80" x2="100" y2="80" stroke="rgba(0,245,255,1)" stroke-width="0.8" stroke-dasharray="5,8"/>
  </g>
  <g class="sl2">
    <line x1="400" y1="140" x2="520" y2="140" stroke="rgba(0,245,255,1)" stroke-width="0.8" stroke-dasharray="3,10"/>
  </g>
  <g class="sl3">
    <line x1="700" y1="60" x2="820" y2="60" stroke="rgba(0,245,255,1)" stroke-width="0.8" stroke-dasharray="6,6"/>
  </g>

  <!-- ─── ROBOT 1 (small, left) ─── -->
  <g class="r1" filter="url(#glow)">
    <!-- Head -->
    <rect x="-10" y="-36" width="20" height="14" class="cyan"/>
    <!-- Eyes -->
    <rect class="eye"  x="-8"  y="-33" width="5" height="4" fill="#00f5ff" opacity="0.9"/>
    <rect class="eye2" x="3"   y="-33" width="5" height="4" fill="#00f5ff" opacity="0.9"/>
    <!-- Antenna -->
    <line x1="0" y1="-36" x2="0" y2="-44" class="cyan"/>
    <circle cx="0" cy="-46" r="2.5" fill="#00f5ff" class="core"/>
    <!-- Body -->
    <rect x="-12" y="-20" width="24" height="20" class="cyan"/>
    <!-- Core -->
    <circle cx="0" cy="-10" r="4" class="cyan core2"/>
    <!-- Arms -->
    <line x1="-12" y1="-16" x2="-20" y2="-8" class="cyan"/>
    <line x1="12"  y1="-16" x2="20"  y2="-8" class="cyan"/>
    <!-- Legs -->
    <line x1="-5" y1="0" x2="-6" y2="12" class="cyan"/>
    <line x1="5"  y1="0" x2="6"  y2="12" class="cyan"/>
    <!-- Feet -->
    <line x1="-6" y1="12" x2="-12" y2="12" class="cyan"/>
    <line x1="6"  y1="12" x2="12"  y2="12" class="cyan"/>
  </g>

  <!-- ─── ROBOT 2 (mid-left) ─── -->
  <g class="r2" filter="url(#glow)">
    <rect x="-8"  y="-28" width="16" height="11" class="cyan"/>
    <rect class="eye"  x="-6" y="-26" width="4" height="3" fill="#00f5ff" opacity="0.9"/>
    <rect class="eye2" x="2"  y="-26" width="4" height="3" fill="#00f5ff" opacity="0.9"/>
    <line x1="0" y1="-28" x2="0" y2="-35" class="cyan"/>
    <circle cx="0" cy="-37" r="2" fill="#00f5ff" class="core2"/>
    <rect x="-9" y="-15" width="18" height="15" class="cyan"/>
    <circle cx="0" cy="-7" r="3" class="cyan core"/>
    <line x1="-9" y1="-12" x2="-16" y2="-5" class="cyan"/>
    <line x1="9"  y1="-12" x2="16"  y2="-5" class="cyan"/>
    <line x1="-4" y1="0"   x2="-5"  y2="10" class="cyan"/>
    <line x1="4"  y1="0"   x2="5"   y2="10" class="cyan"/>
    <line x1="-5" y1="10"  x2="-10" y2="10" class="cyan"/>
    <line x1="5"  y1="10"  x2="10"  y2="10" class="cyan"/>
  </g>

  <!-- ─── ROBOT 3 (right) ─── -->
  <g class="r3" filter="url(#glow)">
    <rect x="-10" y="-36" width="20" height="14" class="cyan"/>
    <rect class="eye2" x="-8" y="-33" width="5" height="4" fill="#00f5ff" opacity="0.9"/>
    <rect class="eye"  x="3"  y="-33" width="5" height="4" fill="#00f5ff" opacity="0.9"/>
    <line x1="0" y1="-36" x2="0" y2="-44" class="cyan"/>
    <circle cx="0" cy="-46" r="2.5" fill="#00f5ff" class="core2"/>
    <rect x="-12" y="-20" width="24" height="20" class="cyan"/>
    <circle cx="0" cy="-10" r="4" class="cyan core"/>
    <line x1="-12" y1="-16" x2="-20" y2="-8" class="cyan"/>
    <line x1="12"  y1="-16" x2="20"  y2="-8" class="cyan"/>
    <line x1="-5" y1="0" x2="-6" y2="12" class="cyan"/>
    <line x1="5"  y1="0" x2="6"  y2="12" class="cyan"/>
    <line x1="-6" y1="12" x2="-12" y2="12" class="cyan"/>
    <line x1="6"  y1="12" x2="12"  y2="12" class="cyan"/>
  </g>

  <!-- ─── GEAR 1 ─── -->
  <g class="g1" filter="url(#glow)">
    <circle cx="0" cy="0" r="12" class="dim"/>
    <circle cx="0" cy="0" r="5"  class="dim"/>
    <circle cx="0" cy="0" r="2"  fill="rgba(0,245,255,0.4)"/>
    <!-- Teeth -->
    <rect x="-2" y="-16" width="4" height="5" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
    <rect x="-2" y="11"  width="4" height="5" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
    <rect x="-16" y="-2" width="5" height="4" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
    <rect x="11"  y="-2" width="5" height="4" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
    <rect x="-13" y="-13" width="4" height="4" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
    <rect x="9"   y="-13" width="4" height="4" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
    <rect x="-13" y="9"   width="4" height="4" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
    <rect x="9"   y="9"   width="4" height="4" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
  </g>

  <!-- ─── GEAR 2 (larger) ─── -->
  <g class="g2" filter="url(#glow)">
    <circle cx="0" cy="0" r="16" class="dim"/>
    <circle cx="0" cy="0" r="7"  class="dim"/>
    <circle cx="0" cy="0" r="3"  fill="rgba(0,245,255,0.35)"/>
    <rect x="-2.5" y="-21" width="5" height="6" fill="none" stroke="rgba(0,245,255,0.28)" stroke-width="1"/>
    <rect x="-2.5" y="15"  width="5" height="6" fill="none" stroke="rgba(0,245,255,0.28)" stroke-width="1"/>
    <rect x="-22" y="-2.5" width="6" height="5" fill="none" stroke="rgba(0,245,255,0.28)" stroke-width="1"/>
    <rect x="16"  y="-2.5" width="6" height="5" fill="none" stroke="rgba(0,245,255,0.28)" stroke-width="1"/>
    <rect x="-17" y="-17"  width="5" height="5" fill="none" stroke="rgba(0,245,255,0.28)" stroke-width="1"/>
    <rect x="12"  y="-17"  width="5" height="5" fill="none" stroke="rgba(0,245,255,0.28)" stroke-width="1"/>
    <rect x="-17" y="12"   width="5" height="5" fill="none" stroke="rgba(0,245,255,0.28)" stroke-width="1"/>
    <rect x="12"  y="12"   width="5" height="5" fill="none" stroke="rgba(0,245,255,0.28)" stroke-width="1"/>
  </g>

  <!-- ─── CIRCUIT NODE 1 ─── -->
  <g class="c1" filter="url(#glow)">
    <circle cx="0" cy="0" r="5" class="dim"/>
    <circle cx="0" cy="0" r="2" fill="rgba(0,245,255,0.5)"/>
    <line x1="0"  y1="-5"  x2="0"   y2="-16" class="dim"/>
    <line x1="0"  y1="5"   x2="0"   y2="16"  class="dim"/>
    <line x1="-5" y1="0"   x2="-16" y2="0"   class="dim"/>
    <line x1="5"  y1="0"   x2="16"  y2="0"   class="dim"/>
    <circle cx="0"   cy="-16" r="2.5" class="dim"/>
    <circle cx="0"   cy="16"  r="2.5" class="dim"/>
    <circle cx="-16" cy="0"   r="2.5" class="dim"/>
    <circle cx="16"  cy="0"   r="2.5" class="dim"/>
    <!-- Extra branch -->
    <line x1="16" y1="0" x2="16" y2="10" class="dim"/>
    <line x1="16" y1="10" x2="24" y2="10" class="dim"/>
    <circle cx="24" cy="10" r="2" class="dim"/>
  </g>

  <!-- ─── CIRCUIT NODE 2 (smaller) ─── -->
  <g class="c2" filter="url(#glow)">
    <circle cx="0" cy="0" r="4"  class="dim"/>
    <circle cx="0" cy="0" r="1.5" fill="rgba(0,245,255,0.5)"/>
    <line x1="0"  y1="-4"  x2="0"  y2="-12" class="dim"/>
    <line x1="0"  y1="4"   x2="0"  y2="12"  class="dim"/>
    <line x1="-4" y1="0"   x2="-12" y2="0"  class="dim"/>
    <line x1="4"  y1="0"   x2="12"  y2="0"  class="dim"/>
    <circle cx="0"   cy="-12" r="2" class="dim"/>
    <circle cx="0"   cy="12"  r="2" class="dim"/>
    <circle cx="-12" cy="0"   r="2" class="dim"/>
    <circle cx="12"  cy="0"   r="2" class="dim"/>
  </g>

  <!-- ─── CENTRE TEXT ─── -->
  <g filter="url(#glow-strong)" class="title-anim">
    <!-- Status line -->
    <text x="430" y="68" text-anchor="middle" class="text-sub" font-size="10" letter-spacing="4">// EMBEDDED SYSTEMS ENGINEER</text>

    <!-- Main name -->
    <text x="430" y="108" text-anchor="middle" class="text-name" font-size="28" letter-spacing="3" font-family="'Courier New', monospace">SOMANATH PATTANASHETTI</text>

    <!-- Sub line -->
    <text x="430" y="134" text-anchor="middle" class="text-main" font-size="11" letter-spacing="3">@ LG SOFT INDIA  ·  BENGALURU  ·  FAANG ASPIRANT</text>

    <!-- Bottom tag line -->
    <text x="430" y="162" text-anchor="middle" class="text-sub" font-size="9.5" letter-spacing="2">EMBEDDED C  ·  C++  ·  RTOS  ·  LEETCODE  ·  2028 TARGET 🚀</text>
  </g>

  <!-- Pulse dots flanking name -->
  <circle cx="185" cy="105" r="3" fill="#00f5ff" class="pd1" filter="url(#glow)"/>
  <circle cx="675" cy="105" r="3" fill="#00f5ff" class="pd2" filter="url(#glow)"/>
  <circle cx="192" cy="105" r="3" fill="#00f5ff" opacity="0.3"/>
  <circle cx="668" cy="105" r="3" fill="#00f5ff" opacity="0.3"/>

  <!-- Horizontal divider lines -->
  <line x1="60"  y1="78" x2="300" y2="78" stroke="rgba(0,245,255,0.15)" stroke-width="0.8"/>
  <line x1="560" y1="78" x2="800" y2="78" stroke="rgba(0,245,255,0.15)" stroke-width="0.8"/>
  <line x1="60"  y1="148" x2="300" y2="148" stroke="rgba(0,245,255,0.12)" stroke-width="0.8"/>
  <line x1="560" y1="148" x2="800" y2="148" stroke="rgba(0,245,255,0.12)" stroke-width="0.8"/>
</svg>
